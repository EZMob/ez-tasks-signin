<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to EZ-Tasks</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; color: #1a1d24; }
  main { max-width: 440px; margin: 10vh auto; background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; padding: 28px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { line-height: 1.45; color: #3c4450; }
  label { display: block; font-size: 0.9rem; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cfd5de; border-radius: 8px; font-size: 1rem; }
  button { margin-top: 14px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font-size: 1rem; }
  .error { color: #9b1c1c; }
</style>
</head>
<body>
<main>
  <h1 id="title">Sign in to EZ-Tasks</h1>
  <p id="intro">Use the work email on your EZ-Tasks employee profile. We will email you a sign-in link.</p>
  <form method="post" action="https://tyjtsirlwcfntnshtgfl.supabase.co/functions/v1/tasks-mcp/authorize">
    <label for="email">Work email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <input type="hidden" name="request_id" id="request_id">
    <p id="error" class="error" hidden></p>
    <button type="submit">Email me a sign-in link</button>
  </form>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const requestId = params.get('request') || '';
  const errorText = params.get('error') || '';
  const valid = /^[0-9a-f-]{36}$/i.test(requestId);
  if (errorText || !valid) {
    document.getElementById('title').textContent = 'Sign-in failed';
    document.getElementById('intro').textContent = errorText || 'This sign-in link is invalid. Start again from your AI tool.';
    document.querySelector('form').hidden = true;
  } else {
    document.getElementById('request_id').value = requestId;
  }
</script>
</body>
</html>
